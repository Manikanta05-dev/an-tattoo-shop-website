    <!-- Google Fonts: Playfair Display + Inter -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Analytics (gtag.js) — VITE_GA_ID injected at build time -->
    <script>
      window.__GA_ID = '%VITE_GA_ID%';
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      if (window.__GA_ID && window.__GA_ID !== '%VITE_GA_ID%') {
        gtag('config', window.__GA_ID);
      }
    </script>
  </head>

  </body>
